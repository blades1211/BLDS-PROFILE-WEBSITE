<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLDS DOMINION</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050505;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* TYPOGRAPHY & BUTTONS */
    h1, h2, h3 {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .btn {
      background: transparent;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      width: 100%;
      max-width: 320px;
      margin: 8px 0;
    }

    .btn:hover, .btn:active {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .btn-secondary {
      border-color: #222;
      color: #888;
    }

    .btn-secondary:hover {
      background: #222;
      color: #fff;
    }

    .input-field {
      width: 100%;
      max-width: 320px;
      background: #0d0d0d;
      border: 1px solid #222222;
      color: #ffffff;
      padding: 12px;
      font-size: 14px;
      text-align: center;
      margin: 8px 0;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-field:focus {
      border-color: #ffffff;
    }

    /* CONTAINER LAYOUT */
    .view-section {
      display: none;
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease-in-out;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* LOGO & GLOW EFFECT */
    .logo-container {
      margin-bottom: 24px;
    }

    .logo-container img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: 
        drop-shadow(0 0 8px rgba(255, 255, 255, 0.25))
        drop-shadow(0 0 18px rgba(255, 255, 255, 0.10));
      animation: logoBreathingGlow 5s ease-in-out infinite alternate;
    }

    @keyframes logoBreathingGlow {
      0% {
        filter: 
          drop-shadow(0 0 6px rgba(255, 255, 255, 0.20))
          drop-shadow(0 0 14px rgba(255, 255, 255, 0.08));
      }
      100% {
        filter: 
          drop-shadow(0 0 10px rgba(255, 255, 255, 0.30))
          drop-shadow(0 0 22px rgba(255, 255, 255, 0.14));
      }
    }

    .title {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #666666;
      margin-bottom: 32px;
      font-weight: 300;
    }

    /* BACK BUTTON */
    .back-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 24px;
      align-self: flex-start;
      letter-spacing: 1px;
    }

    .back-btn:hover {
      color: #fff;
    }

    /* PROFILE STYLING */
    .profile-card {
      width: 100%;
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
      padding: 24px 0;
      margin: 16px 0;
      text-align: left;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 700;
    }

    .profile-id {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .roles-list {
      display: flex;
      gap: 6px;
      margin: 12px 0;
      flex-wrap: wrap;
    }

    .role-badge {
      border: 1px solid #444;
      font-size: 10px;
      padding: 3px 8px;
      letter-spacing: 1px;
    }

    .profile-info {
      font-size: 12px;
      color: #888;
      margin: 16px 0;
    }

    .section-title {
      font-size: 11px;
      color: #555;
      letter-spacing: 1.5px;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .badges-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-item {
      background: #0d0d0d;
      border: 1px solid #222;
      padding: 8px 12px;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .fragment-box {
      font-size: 20px;
      font-weight: 700;
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      background: #ffffff;
      color: #000000;
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast"></div>

  <!-- TAMPILAN 1: TAMPILAN AWAL MEMASUKKAN NAMA -->
  <section id="view-enter-name" class="view-section active">
    <div class="logo-container">
      <img src="logo.png" alt="BLDS Logo">
    </div>
    <h1 class="title">JOIN DOMINION</h1>
    <p class="subtitle">Enter Your Name</p>
    <input type="text" id="user-name-input" class="input-field" placeholder="Enter Name (e.g. Michael)">
    <button class="btn" onclick="registerUser()">CONTINUE</button>
  </section>

  <!-- TAMPILAN 2: TAMPILAN KEDUA (MAIN MENU) -->
  <section id="view-main-menu" class="view-section">
    <div class="logo-container">
      <img src="logo.png" alt="BLDS Logo">
    </div>
    <h1 class="title">MAIN MENU</h1>
    <p class="subtitle" id="welcome-user-text">Welcome, Dominioner</p>
    
    <button class="btn" onclick="openProfileView()">PROFILE</button>
    <button class="btn" onclick="navigateTo('view-secret-code')">SECRET CODE</button>
  </section>

  <!-- TAMPILAN 3: PROFILE DISPLAY -->
  <section id="view-profile" class="view-section">
    <button class="back-btn" onclick="navigateTo('view-main-menu')">← BACK TO MENU</button>
    
    <div class="profile-card">
      <div class="profile-header">
        <div>
          <div class="profile-name" id="prof-name">-</div>
          <div class="profile-id" id="prof-id">ID: -</div>
        </div>
      </div>

      <div class="roles-list" id="prof-roles">
        <span class="role-badge">[ MEMBER ]</span>
      </div>

      <div class="profile-info">
        Joined:<br>
        <span id="prof-joined" style="color: #fff;">-</span>
      </div>

      <div class="section-title">BADGES</div>
      <div class="badges-grid" id="prof-badges">
        <div class="badge-item">[ NEW DOMINIONER ]</div>
      </div>

      <div class="section-title">FRAGMENT</div>
      <div class="fragment-box" id="prof-fragment">0</div>
    </div>
  </section>

  <!-- TAMPILAN 4: SECRET CODE REDEEM -->
  <section id="view-secret-code" class="view-section">
    <button class="back-btn" onclick="navigateTo('view-main-menu')">← BACK TO MENU</button>
    <h2 class="title">SECRET CODE</h2>
    <p class="subtitle">Claim Dominion Rewards</p>
    
    <input type="text" id="redeem-code-input" class="input-field" placeholder="Enter Secret Code">
    <button class="btn" onclick="redeemCode()">REDEEM</button>
  </section>

  <!-- FIREBASE REALTIME DATABASE SDK (COMPAT MODULES) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // ----------------------------------------------------
    // FIREBASE INITIALIZATION
    // ----------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://blds-profile-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // STATE LOKAL USER
    let currentUser = null;

    // Helper: Formatter Angka ke 4 Digit (1 -> 0001)
    function padFourDigits(num) {
      return String(num).padStart(4, '0');
    }

    // Helper: Toast Alert
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    // Navigation Helper
    function navigateTo(viewId) {
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');
    }

    // ----------------------------------------------------
    // PROCESS 1: PROSES PENDAFTARAN & FORMAT ID (Nama-0001)
    // ----------------------------------------------------
    function registerUser() {
      const inputName = document.getElementById('user-name-input').value.trim();
      if (!inputName) return showToast("Silakan masukkan nama Anda!");

      const counterRef = db.ref('counters/lastDominionerNumber');
      
      // Ambil urutan nomor secara otomatis & terstruktur
      counterRef.transaction((currentVal) => {
        return (currentVal || 0) + 1;
      }, (error, committed, snapshot) => {
        if (error) {
          showToast("Terjadi kesalahan sistem.");
        } else if (committed) {
          const numberSeq = snapshot.val();
          const formattedNumber = padFourDigits(numberSeq); // 0001, 0002, dst
          const fullDominionerId = `${inputName}-${formattedNumber}`; // Format: Michael-0001

          const nowStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

          const userData = {
            dominionerId: fullDominionerId,
            name: inputName,
            numberSeq: formattedNumber,
            joinedDate: nowStr,
            fragment: 0,
            roles: ["Member"],
            badges: { "New Dominioner": true }
          };

          // Simpan ke Realtime Database
          db.ref('members/' + fullDominionerId).set(userData).then(() => {
            currentUser = userData;
            document.getElementById('welcome-user-text').innerText = `Welcome, ${fullDominionerId}`;
            navigateTo('view-main-menu'); // Buka Tampilan Kedua
          });
        }
      });
    }

    // ----------------------------------------------------
    // PROCESS 2: PROFILE DISPLAY
    // ----------------------------------------------------
    function openProfileView() {
      if (!currentUser) return navigateTo('view-enter-name');

      document.getElementById('prof-name').innerText = currentUser.name;
      document.getElementById('prof-id').innerText = currentUser.dominionerId;
      document.getElementById('prof-joined').innerText = currentUser.joinedDate;
      document.getElementById('prof-fragment').innerText = currentUser.fragment;

      navigateTo('view-profile');
    }

    // ----------------------------------------------------
    // PROCESS 3: SECRET CODE REDEEM
    // ----------------------------------------------------
    function redeemCode() {
      if (!currentUser) return showToast("Silakan daftar terlebih dahulu.");
      
      const codeStr = document.getElementById('redeem-code-input').value.trim();
      if (!codeStr) return showToast("Masukkan Secret Code!");

      db.ref('secretCodes/' + codeStr).once('value').then(cSnap => {
        if (!cSnap.exists()) return showToast("Kode tidak valid!");

        const codeData = cSnap.val();

        // Cek apakah user sudah pernah klaim
        db.ref('redemptions').orderByChild('dominionerId').equalTo(currentUser.dominionerId).once('value', rSnap => {
          let alreadyClaimed = false;
          rSnap.forEach(r => {
            if (r.val().codeId === codeStr) alreadyClaimed = true;
          });

          if (alreadyClaimed) return showToast("Kode sudah pernah digunakan!");

          let newFrag = (currentUser.fragment || 0) + (codeData.fragmentReward || 0);
          currentUser.fragment = newFrag;

          const updates = {};
          updates[`members/${currentUser.dominionerId}/fragment`] = newFrag;

          const redKey = db.ref('redemptions').push().key;
          updates[`redemptions/${redKey}`] = {
            dominionerId: currentUser.dominionerId,
            codeId: codeStr,
            timestamp: new Date().toLocaleDateString('en-GB')
          };

          db.ref().update(updates).then(() => {
            showToast("Kode Berhasil Diklaim!");
            document.getElementById('redeem-code-input').value = '';
          });
        });
      });
    }
  </script>
</body>
</html>
