<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLDS DOMINION</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050505;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* TYPOGRAPHY & BUTTONS */
    h1, h2, h3 {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .btn {
      background: transparent;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      width: 100%;
      max-width: 320px;
      margin: 8px 0;
    }

    .btn:hover, .btn:active {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .btn-secondary {
      border-color: #333;
      color: #888;
      font-size: 11px;
      padding: 8px 16px;
    }

    .btn-secondary:hover {
      background: #222;
      color: #fff;
    }

    .btn-danger {
      border-color: #551111;
      color: #ff6666;
    }

    .btn-danger:hover {
      background: #551111;
      color: #ffffff;
    }

    .input-field {
      width: 100%;
      max-width: 320px;
      background: #0d0d0d;
      border: 1px solid #222222;
      color: #ffffff;
      padding: 12px;
      font-size: 14px;
      text-align: center;
      margin: 8px 0;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-field:focus {
      border-color: #ffffff;
    }

    .input-field-left {
      text-align: left;
      max-width: 100%;
    }

    /* CONTAINER LAYOUT */
    .view-section {
      display: none;
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease-in-out;
    }

    .view-section.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* LOGO & GLOW EFFECT */
    .logo-container {
      margin-bottom: 24px;
    }

    .logo-container img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: 
        drop-shadow(0 0 8px rgba(255, 255, 255, 0.25))
        drop-shadow(0 0 18px rgba(255, 255, 255, 0.10));
      animation: logoBreathingGlow 5s ease-in-out infinite alternate;
    }

    @keyframes logoBreathingGlow {
      0% {
        filter: 
          drop-shadow(0 0 6px rgba(255, 255, 255, 0.20))
          drop-shadow(0 0 14px rgba(255, 255, 255, 0.08));
      }
      100% {
        filter: 
          drop-shadow(0 0 10px rgba(255, 255, 255, 0.30))
          drop-shadow(0 0 22px rgba(255, 255, 255, 0.14));
      }
    }

    .title {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #666666;
      margin-bottom: 32px;
      font-weight: 300;
    }

    /* BACK BUTTON */
    .back-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 24px;
      align-self: flex-start;
      letter-spacing: 1px;
    }

    .back-btn:hover {
      color: #fff;
    }

    /* PROFILE STYLING */
    .profile-card {
      width: 100%;
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
      padding: 24px 0;
      margin: 16px 0;
      text-align: left;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 700;
    }

    .profile-id {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .roles-list {
      display: flex;
      gap: 6px;
      margin: 12px 0;
      flex-wrap: wrap;
    }

    .role-badge {
      border: 1px solid #444;
      font-size: 10px;
      padding: 3px 8px;
      letter-spacing: 1px;
    }

    .profile-info {
      font-size: 12px;
      color: #888;
      margin: 16px 0;
    }

    .section-title {
      font-size: 11px;
      color: #555;
      letter-spacing: 1.5px;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .badges-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-item {
      background: #0d0d0d;
      border: 1px solid #222;
      padding: 8px 12px;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    .fragment-box {
      font-size: 20px;
      font-weight: 700;
      margin-top: 4px;
    }

    /* ADMIN PANEL STYLING */
    .admin-card {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #222;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .admin-card h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #fff;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      background: #ffffff;
      color: #000000;
      padding: 12px 24px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast"></div>

  <!-- TAMPILAN 1: MASUKAN NAMA -->
  <section id="view-enter-name" class="view-section active">
    <div class="logo-container">
      <img src="logo.png" alt="BLDS Logo">
    </div>
    <h1 class="title">JOIN DOMINION</h1>
    <p class="subtitle">Enter Your Name</p>
    <input type="text" id="user-name-input" class="input-field" placeholder="Dominioners">
    <button class="btn" onclick="registerUser()">CONTINUE</button>
  </section>

  <!-- TAMPILAN 2: MAIN MENU -->
  <section id="view-main-menu" class="view-section">
    <div class="logo-container">
      <img src="logo.png" alt="BLDS Logo">
    </div>
    <h1 class="title">MAIN MENU</h1>
    <p class="subtitle" id="welcome-user-text">Welcome, Dominioner</p>
    
    <button class="btn" onclick="openProfileView()">PROFILE</button>
    <button class="btn" onclick="navigateTo('view-secret-code')">SECRET CODE</button>
    <button class="btn btn-secondary" style="margin-top: 24px;" onclick="navigateTo('view-admin-login')">ADMIN PANEL</button>
  </section>

  <!-- TAMPILAN 3: PROFILE DISPLAY -->
  <section id="view-profile" class="view-section">
    <button class="back-btn" onclick="navigateTo('view-main-menu')">← BACK TO MENU</button>
    
    <div class="profile-card">
      <div class="profile-header">
        <div>
          <div class="profile-name" id="prof-name">-</div>
          <div class="profile-id" id="prof-id">ID: -</div>
        </div>
      </div>

      <div class="roles-list" id="prof-roles"></div>

      <div class="profile-info">
        Joined:<br>
        <span id="prof-joined" style="color: #fff;">-</span>
      </div>

      <div class="section-title">BADGES</div>
      <div class="badges-grid" id="prof-badges"></div>

      <div class="section-title">FRAGMENT</div>
      <div class="fragment-box" id="prof-fragment">0</div>
    </div>
  </section>

  <!-- TAMPILAN 4: SECRET CODE REDEEM -->
  <section id="view-secret-code" class="view-section">
    <button class="back-btn" onclick="navigateTo('view-main-menu')">← BACK TO MENU</button>
    <h2 class="title">SECRET CODE</h2>
    <p class="subtitle">Claim Dominion Rewards</p>
    
    <input type="text" id="redeem-code-input" class="input-field" placeholder="Enter Secret Code">
    <button class="btn" onclick="redeemCode()">REDEEM</button>
  </section>

  <!-- TAMPILAN 5: ADMIN LOGIN -->
  <section id="view-admin-login" class="view-section">
    <button class="back-btn" onclick="navigateTo('view-main-menu')">← BACK TO MENU</button>
    <h2 class="title">STAFF ACCESS</h2>
    <p class="subtitle">Enter Admin Passcode</p>
    
    <input type="password" id="admin-pass-input" class="input-field" placeholder="Passcode">
    <button class="btn" onclick="verifyAdminPass()">LOGIN</button>
  </section>

  <!-- TAMPILAN 6: ADMIN PANEL MAIN -->
  <section id="view-admin-panel" class="view-section" style="max-width: 600px;">
    <button class="back-btn" onclick="navigateTo('view-main-menu')">← LOGOUT ADMIN</button>
    <h2 class="title" style="margin-bottom: 20px;">BLDS ADMIN PANEL</h2>

    <!-- ADMIN 1: CARI PLAYER LEWAT URUTAN -->
    <div class="admin-card">
      <h3>1. SEARCH PLAYER BY ORDER (#0000)</h3>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="adm-search-seq" class="input-field input-field-left" placeholder="Enter number (e.g. #0001 or 0001)">
        <button class="btn" style="width: 120px; margin: 8px 0;" onclick="adminSearchPlayer()">SEARCH</button>
      </div>
    </div>

    <!-- ADMIN 2: EDIT PLAYER DATA (HANYA MUNCUL JIKA PLAYER DITEMUKAN) -->
    <div class="admin-card" id="adm-edit-section" style="display: none;">
      <h3>2. EDIT PLAYER: <span id="adm-target-id" style="color: #66ff66;">-</span></h3>
      
      <label style="font-size: 11px; color: #888;">Title / Rank / Roles (Commas separated):</label>
      <input type="text" id="adm-edit-roles" class="input-field input-field-left" placeholder="e.g. Owner, Founder, VIP">

      <label style="font-size: 11px; color: #888; margin-top: 8px; display: block;">Joined Date:</label>
      <input type="text" id="adm-edit-joined" class="input-field input-field-left" placeholder="e.g. 25 August 2026">

      <label style="font-size: 11px; color: #888; margin-top: 8px; display: block;">Current Fragment:</label>
      <input type="number" id="adm-edit-fragment" class="input-field input-field-left" placeholder="Fragment amount">

      <button class="btn" onclick="adminSavePlayerData()">UPDATE PLAYER DATA</button>
    </div>

    <!-- ADMIN 3: BUAT SECRET CODE BARU -->
    <div class="admin-card">
      <h3>3. CREATE NEW SECRET CODE</h3>
      <input type="text" id="adm-code-name" class="input-field input-field-left" placeholder="Code String (e.g. REWARD-2026)">
      
      <label style="font-size: 11px; color: #888; margin-top: 8px; display: block;">Fragment Reward (0 if none):</label>
      <input type="number" id="adm-code-frag" class="input-field input-field-left" placeholder="0" value="0">

      <label style="font-size: 11px; color: #888; margin-top: 8px; display: block;">Badge Reward Name (Blank if none):</label>
      <input type="text" id="adm-code-badge" class="input-field input-field-left" placeholder="e.g. Event Winner Badge">

      <button class="btn" onclick="adminCreateSecretCode()">CREATE CODE</button>
    </div>

  </section>

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // ----------------------------------------------------
    // FIREBASE INITIALIZATION
    // ----------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://blds-profile-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // STATE MANAGEMENT
    let currentUser = null;
    let selectedAdminPlayer = null;

    // Helper: Formatter Angka ke 4 Digit (1 -> 0001)
    function padFourDigits(num) {
      return String(num).padStart(4, '0');
    }

    // Helper: Toast Alert
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    // Navigation Helper
    function navigateTo(viewId) {
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');
    }

    // ----------------------------------------------------
    // 1. REGISTRATION SYSTEM (Nama-0001)
    // ----------------------------------------------------
    function registerUser() {
      const inputName = document.getElementById('user-name-input').value.trim();
      if (!inputName) return showToast("Silakan masukkan nama Anda!");

      const counterRef = db.ref('counters/lastDominionerNumber');
      
      counterRef.transaction((currentVal) => {
        return (currentVal || 0) + 1;
      }, (error, committed, snapshot) => {
        if (error) {
          showToast("Terjadi kesalahan sistem.");
        } else if (committed) {
          const numberSeq = snapshot.val();
          const formattedNumber = padFourDigits(numberSeq); // 0001, 0002...
          const fullDominionerId = `${inputName}-${formattedNumber}`;

          const nowStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

          const userData = {
            dominionerId: fullDominionerId,
            name: inputName,
            numberSeq: formattedNumber,
            joinedDate: nowStr,
            fragment: 0,
            roles: ["Member"],
            badges: { "New Dominioner": true }
          };

          db.ref('members/' + fullDominionerId).set(userData).then(() => {
            currentUser = userData;
            document.getElementById('welcome-user-text').innerText = `Welcome, ${fullDominionerId}`;
            navigateTo('view-main-menu');
          });
        }
      });
    }

    // ----------------------------------------------------
    // 2. PROFILE VIEW
    // ----------------------------------------------------
    function openProfileView() {
      if (!currentUser) return navigateTo('view-enter-name');

      // Ambil data terbaru dari db
      db.ref('members/' + currentUser.dominionerId).once('value').then(snap => {
        if (snap.exists()) {
          currentUser = snap.val();
        }

        document.getElementById('prof-name').innerText = currentUser.name;
        document.getElementById('prof-id').innerText = `ID: ${currentUser.dominionerId}`;
        document.getElementById('prof-joined').innerText = currentUser.joinedDate || '-';
        document.getElementById('prof-fragment').innerText = (currentUser.fragment || 0).toLocaleString();

        // Render Roles
        const rolesContainer = document.getElementById('prof-roles');
        rolesContainer.innerHTML = '';
        if (currentUser.roles) {
          currentUser.roles.forEach(role => {
            const span = document.createElement('span');
            span.className = 'role-badge';
            span.innerText = `[ ${role.toUpperCase()} ]`;
            rolesContainer.appendChild(span);
          });
        }

        // Render Badges
        const badgesContainer = document.getElementById('prof-badges');
        badgesContainer.innerHTML = '';
        if (currentUser.badges) {
          Object.keys(currentUser.badges).forEach(b => {
            const div = document.createElement('div');
            div.className = 'badge-item';
            div.innerText = `[ ${b.toUpperCase()} ]`;
            badgesContainer.appendChild(div);
          });
        }

        navigateTo('view-profile');
      });
    }

    // ----------------------------------------------------
    // 3. SECRET CODE REDEEM
    // ----------------------------------------------------
    function redeemCode() {
      if (!currentUser) return showToast("Silakan daftar terlebih dahulu.");
      
      const codeStr = document.getElementById('redeem-code-input').value.trim();
      if (!codeStr) return showToast("Masukkan Secret Code!");

      db.ref('secretCodes/' + codeStr).once('value').then(cSnap => {
        if (!cSnap.exists()) return showToast("Kode tidak valid!");

        const codeData = cSnap.val();

        db.ref('redemptions').orderByChild('dominionerId').equalTo(currentUser.dominionerId).once('value', rSnap => {
          let alreadyClaimed = false;
          rSnap.forEach(r => {
            if (r.val().codeId === codeStr) alreadyClaimed = true;
          });

          if (alreadyClaimed) return showToast("Kode sudah pernah digunakan!");

          let newFrag = (currentUser.fragment || 0) + (codeData.fragmentReward || 0);
          currentUser.fragment = newFrag;

          const updates = {};
          updates[`members/${currentUser.dominionerId}/fragment`] = newFrag;

          if (codeData.badgeReward) {
            updates[`members/${currentUser.dominionerId}/badges/${codeData.badgeReward}`] = true;
          }

          const redKey = db.ref('redemptions').push().key;
          updates[`redemptions/${redKey}`] = {
            dominionerId: currentUser.dominionerId,
            codeId: codeStr,
            timestamp: new Date().toLocaleDateString('en-GB')
          };

          db.ref().update(updates).then(() => {
            showToast("Kode Berhasil Diklaim!");
            document.getElementById('redeem-code-input').value = '';
          });
        });
      });
    }

    // ----------------------------------------------------
    // 4. ADMIN PANEL FUNCTIONS
    // ----------------------------------------------------
    function verifyAdminPass() {
      const pass = document.getElementById('admin-pass-input').value.trim();
      if (pass === "BLDS-STAFF-ONLY-PANEL-0000") {
        document.getElementById('admin-pass-input').value = '';
        navigateTo('view-admin-panel');
      } else {
        showToast("Passcode Admin Salah!");
      }
    }

    // Cari Player Berdasarkan Nomor Urut (#0001)
    function adminSearchPlayer() {
      let query = document.getElementById('adm-search-seq').value.trim().replace('#', '');
      if (/^\d+$/.test(query)) {
        query = padFourDigits(parseInt(query));
      }

      if (!query) return showToast("Masukkan nomor urut player!");

      db.ref('members').once('value').then(snap => {
        let found = null;
        snap.forEach(child => {
          const p = child.val();
          if (p.numberSeq === query || p.dominionerId.endsWith(`-${query}`)) {
            found = p;
          }
        });

        if (found) {
          selectedAdminPlayer = found;
          document.getElementById('adm-target-id').innerText = found.dominionerId;
          document.getElementById('adm-edit-roles').value = found.roles ? found.roles.join(', ') : '';
          document.getElementById('adm-edit-joined').value = found.joinedDate || '';
          document.getElementById('adm-edit-fragment').value = found.fragment || 0;
          document.getElementById('adm-edit-section').style.display = 'block';
          showToast("Player ditemukan!");
        } else {
          document.getElementById('adm-edit-section').style.display = 'none';
          showToast("Player tidak ditemukan!");
        }
      });
    }

    // Edit Data Player (Roles, Joined Date, Fragment)
    function adminSavePlayerData() {
      if (!selectedAdminPlayer) return;

      const rolesInput = document.getElementById('adm-edit-roles').value.trim();
      const joinedInput = document.getElementById('adm-edit-joined').value.trim();
      const fragInput = parseInt(document.getElementById('adm-edit-fragment').value) || 0;

      const updatedRoles = rolesInput ? rolesInput.split(',').map(r => r.trim()) : ["Member"];

      const updates = {
        roles: updatedRoles,
        joinedDate: joinedInput,
        fragment: fragInput
      };

      db.ref('members/' + selectedAdminPlayer.dominionerId).update(updates).then(() => {
        showToast("Data Player Berhasil Diperbarui!");
      });
    }

    // Buat Secret Code Baru (Badge / Fragment / Kombinasi)
    function adminCreateSecretCode() {
      const codeName = document.getElementById('adm-code-name').value.trim();
      const fragReward = parseInt(document.getElementById('adm-code-frag').value) || 0;
      const badgeReward = document.getElementById('adm-code-badge').value.trim();

      if (!codeName) return showToast("Masukkan String Kode!");
      if (fragReward <= 0 && !badgeReward) return showToast("Isi Fragment atau Badge Reward!");

      const codeData = {
        code: codeName,
        fragmentReward: fragReward,
        badgeReward: badgeReward || null
      };

      db.ref('secretCodes/' + codeName).set(codeData).then(() => {
        showToast(`Secret Code '${codeName}' Dibuat!`);
        document.getElementById('adm-code-name').value = '';
        document.getElementById('adm-code-frag').value = '0';
        document.getElementById('adm-code-badge').value = '';
      });
    }
  </script>
</body>
</html>
