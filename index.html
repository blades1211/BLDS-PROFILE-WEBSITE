<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dominion Leaderboard & Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- LEADERBOARD SECTION -->
    <section class="leaderboard-section">
      <h1>🏆 Dominion Leaderboard</h1>
      <p class="subtitle">Klik kartu pemain mana saja untuk inspect profil!</p>
      <div id="leaderboardList" class="leaderboard-grid"></div>
    </section>

    <!-- INSPECT / PROFILE MODAL -->
    <div id="profileModal" class="modal hidden">
      <div class="modal-overlay" onclick="closeProfileView()"></div>
      <div class="modal-content">
        <button class="close-btn" onclick="closeProfileView()">&times;</button>
        
        <!-- DYNAMIC PROFILE CARD -->
        <div id="profileCard" class="profile-card">
          <!-- Canvas Sticker Overlay -->
          <div id="stickerLayer" class="sticker-layer"></div>
          
          <div class="profile-header">
            <div class="avatar-wrapper">
              <img id="viewAvatar" src="" alt="Avatar" />
              <span id="viewRankBadge" class="rank-badge">#1</span>
            </div>
            <div class="user-info">
              <h2 id="viewUsername">Username</h2>
              <span id="viewDominionId" class="dominion-id">ID: DOM-0000</span>
              <div id="viewRoleBadges" class="badge-container"></div>
            </div>
          </div>

          <div class="profile-body">
            <div class="stat-box">
              <span class="stat-label">Total Points</span>
              <span id="viewPoints" class="stat-value">0</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Dominion Level</span>
              <span id="viewLevel" class="stat-value">Lv. 1</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Likes</span>
              <span id="viewLikes" class="stat-value">❤️ 0</span>
            </div>
          </div>

          <!-- PUBLIC ACTIONS (Like Button) -->
          <div id="publicActions" class="actions-container hidden">
            <button id="likeBtn" class="btn btn-like" onclick="handleLike()">
              ❤️ Give Like
            </button>
          </div>

          <!-- OWNER ACTIONS (Sticker/Deco Editor) -->
          <div id="ownerActions" class="actions-container hidden">
            <h3>🎨 Edit Stiker Profil Saya</h3>
            <div class="sticker-picker">
              <button onclick="addSticker('👑')">👑</button>
              <button onclick="addSticker('🔥')">🔥</button>
              <button onclick="addSticker('⭐')">⭐</button>
              <button onclick="addSticker('💎')">💎</button>
              <button onclick="addSticker('⚡')">⚡</button>
              <button onclick="clearStickers()" class="btn-danger">Hapus Semua</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
